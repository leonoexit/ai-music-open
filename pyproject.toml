[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-music-open"
version = "0.1.0"
description = "A model-agnostic, self-hosted AI music generation workspace."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "redis>=5,<7",
    "rq>=2,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
gpu = [
    "heartlib @ git+https://github.com/HeartMuLa/heartlib.git@3783bdb",
]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
